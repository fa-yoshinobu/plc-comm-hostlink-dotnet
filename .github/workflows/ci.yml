name: ci

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check release workflows do not auto-publish
        shell: pwsh
        run: ./scripts/check_no_auto_publish.ps1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore PlcComm.KvHostLink.sln

      - name: Build
        run: dotnet build PlcComm.KvHostLink.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test PlcComm.KvHostLink.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Validate NuGet package contents
        shell: pwsh
        run: ./scripts/check_package_contents.ps1

      - name: Format check
        run: dotnet format PlcComm.KvHostLink.sln --verify-no-changes --no-restore

      - name: Upload test results
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: "**/test-results.trx"
          if-no-files-found: ignore
          retention-days: 7

  linux-lifecycle-smoke:
    name: Linux lifecycle smoke / .NET 10
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup representative .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore representative test target
        run: >-
          dotnet restore tests/PlcComm.KvHostLink.Tests/PlcComm.KvHostLink.Tests.csproj
          -p:TargetFramework=net10.0

      - name: Run bounded loopback lifecycle contract smoke
        run: >-
          dotnet test tests/PlcComm.KvHostLink.Tests/PlcComm.KvHostLink.Tests.csproj
          --configuration Release
          --framework net10.0
          --no-restore
          --filter Category=CrossOsLifecycle
